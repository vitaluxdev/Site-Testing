<!DOCTYPE html>
<html lang="en">
<head>

    <script src="main.js"></script>
    <script src="jquery.js"></script>
    <script>
        $(function(){
          $("#home").load("/home.html"); 
        });
        $(function(){
          $("#friends").load("/friends.html"); 
        });
        $(function(){
          $("#projects").load("/projects.html"); 
        });
    </script>

    <link rel="stylesheet" href="style.css">
    <title>Home | ShellSharp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="SSLogo.svg"> 
    
    <!-- Open Graph (social media embed) -->
    <meta content="ShellSharp" property="og:title">
    <meta content="The official ShellSharp home page" property="og:description">
    <meta content="https://shellsharp.com/" property="og:url">
    <meta property="og:image" content="https://shellsharp.com/SSLogo.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="256">
    <meta property="og:image:height" content="256">
</head>
<body>
    <div class="pageContents">
        <div class="navBar">
            <button class="titleButton">
                <img id="logo" src="Img/SSLogo.svg">
                <div class="siteTitle">
                    <p id="title">ShellSharp</p>
                    <p id="extension">.com</p>
                </div>
            </button>
            <div class="separator"></div>
            <div class="pages">
                <button id="buttonHome" onmousedown="pageHome()" class="pageButton-active">
                    <p>Home</p>
                </button>
                <button id="buttonFriends" onmousedown="pageFriends()" class="pageButton">
                    <p>Friends</p>
                </button>
                <button id="buttonProjects" onmousedown="pageProjects()" class="pageButton">
                    <p>Projects</p>
                </button>
            </div>
        </div>
        <div class="section">
            <div style="display: block;" id="home"></div>
            <div style="display: none;" id="friends"></div>
            <div style="display: none;" id="projects"></div>
        </div>
        <div class="footer">
            <!-- <img id="sizeSetter"> -->
        </div>
    </div>
</body>
</html>
